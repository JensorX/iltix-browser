name: Build Iltix Browser

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: 'Docker image to use (e.g. uazo/cromite-build:147.0.7727.56-271900671db643de04aa9f909f0dcc3415c8b827)'
        required: false
        default: 'auto'
      arch:
        description: 'Android architecture [arm64/arm/x64]'
        required: true
        default: 'arm64'
      debug:
        description: 'Debug build? [true/false]'
        required: true
        default: 'false'

  push:
    branches:
      - iltix
    paths:
      - 'build/patches/Iltix-*.patch'
      - 'build/cromite_patches_list.txt'
      - 'build/cromite.gn_args'
      - 'tools/iltix/**'
      - '.github/workflows/build_iltix.yaml'

env:
  ARCH: ${{ github.event.inputs.arch || 'arm64' }}
  TARGET_ISDEBUG: ${{ github.event.inputs.debug || 'false' }}

  # 🔥 FIX: Proxy komplett deaktivieren
  http_proxy: ""
  https_proxy: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""

jobs:
  setup:
    name: "Resolve Cromite build image"
    runs-on: ubuntu-latest

    outputs:
      cromite_sha: ${{ steps.resolve.outputs.cromite_sha }}
      chromium_version: ${{ steps.resolve.outputs.chromium_version }}
      docker_image: ${{ steps.resolve.outputs.docker_image }}

    steps:
      # 🔥 FIX: Proxy auch hier aktiv entfernen
      - name: Disable proxy
        run: |
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY || true
          git config --global --unset http.proxy || true
          git config --global --unset https.proxy || true

      - name: Checkout Iltix repo
        uses: actions/checkout@v4
        with:
          ref: iltix

      - name: Resolve Latest Cromite Build Image
        id: resolve
        run: |
          echo "[iltix] Fetching latest tags from Docker Hub..."

          if [ "${{ github.event.inputs.docker_image }}" == "auto" ] || [ -z "${{ github.event.inputs.docker_image }}" ]; then
            LATEST_TAG=$(curl -s "https://hub.docker.com/v2/repositories/uazo/cromite-build/tags/?page_size=1&ordering=last_updated" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['name'])")

            DOCKER_IMAGE="uazo/cromite-build:${LATEST_TAG}"
          else
            DOCKER_IMAGE="${{ github.event.inputs.docker_image }}"
            LATEST_TAG=$(echo $DOCKER_IMAGE | cut -d':' -f2)
          fi

          echo "docker_image=$DOCKER_IMAGE" >> $GITHUB_OUTPUT
          echo "cromite_sha=$LATEST_TAG" >> $GITHUB_OUTPUT
