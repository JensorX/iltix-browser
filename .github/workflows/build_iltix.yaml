name: Build Iltix (Cromite + iltix patches)
permissions:
  actions: write
  contents: read
  checks: none
  deployments: none
  issues: none
  packages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

on:
  push:
    branches:
      - 'iltix'
  workflow_dispatch:
    inputs:
      sha:
        description: 'uazo/cromite SHA'
        required: true
        default: ''
      target_os:
        description: 'targetos [android/win/linux/all]'
        required: true
        default: 'android'
      build:
        description: 'android arch [arm/arm64/x64/all]'
        required: true
        default: 'arm64'
      type:
        description: 'runner? [dev/ci]'
        required: true
        default: 'ci'
      debug:
        description: 'debug? [true/false]'
        required: true
        default: 'false'
      clangd:
        description: 'clangd? [true/false]'
        required: true
        default: 'false'
      cromite_release:
        description: 'uazo/cromite release tag (or "latest")'
        required: false
        default: 'latest'
      out_url:
        description: 'Optional: direct URL to out-arm64 tar.gz (used before other lookups)'
        required: false
        default: ''
      sign:
        description: 'Sign build? [true/false] (default false)'
        required: false
        default: 'false'

env:
  CROMITE_SHA: ${{ github.event.inputs.sha || github.sha }}
  REMOVEDOCKERSUPPORT: true
  USELOCALIMAGE: true

jobs:
  check_images:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.cromite_release == 'build' || github.event.inputs.cromite_release == '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cromite
        uses: actions/checkout@v4
        with:
          repository: uazo/cromite
          path: cromite
          ref: ${{ github.event.inputs.sha || github.sha }}
          fetch-depth: 1

      - name: Enable proxy on container
        shell: bash
        run: |
          if ! [[ -z "${HTTP_PROXY}" ]]; then
            PROXY_ADDR=http://$(hostname -I | cut -d' ' -f1 | xargs):8118
            echo "PROXY_ADDR=$PROXY_ADDR" >> $GITHUB_ENV
            sudo iptables -D INPUT -p tcp -s localhost --dport 8118 -j ACCEPT || true
            sudo iptables -D INPUT -p tcp --dport 8118 -j DROP || true
          fi

      - name: Download regctl
        shell: bash
        run: |
          curl -L https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64 >regctl
          chmod 755 regctl

      - name: Get current chromium version
        shell: bash
        run: |
          export VERSION=$( cat ./cromite/build/RELEASE )

          echo Current version is $VERSION
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          cd cromite/tools

      - name: Building build-deps container ${{ env.VERSION }}
        shell: bash
        run: |
          docker pull uazo/build-deps:$VERSION || true
          IS_PRESENT=$(docker inspect --type=image uazo/build-deps:$VERSION > /dev/null ; echo $?)
          if [ $IS_PRESENT -ne "0" ]; then
            IS_PRESENT=$(./regctl image inspect uazo/build-deps:$VERSION > /dev/null ; echo $?)
            if [ $IS_PRESENT -ne "0" ]; then
              DOCKER_BUILDKIT=1 docker build -t uazo/build-deps:$VERSION \
                --progress plain \
                --build-arg VERSION=$VERSION \
                --build-arg HTTP_PROXY="$PROXY_ADDR" \
                --no-cache \
                cromite/tools/images/build-deps/.
            fi
          fi

      - name: Building chromium container ${{ env.VERSION }}
        shell: bash
        run: |
          docker pull uazo/chromium:$VERSION || true
          IS_PRESENT=$(docker inspect --type=image uazo/chromium:$VERSION > /dev/null ; echo $?)
          if [ $IS_PRESENT -ne "0" ]; then
            IS_PRESENT=$(./regctl image inspect uazo/chromium:$VERSION > /dev/null ; echo $?)
            if [ $IS_PRESENT -ne "0" ]; then
              DOCKER_BUILDKIT=1 docker build -t uazo/chromium:$VERSION \
                --progress plain \
                --build-arg VERSION=$VERSION \
                --build-arg HTTP_PROXY="$PROXY_ADDR" \
                cromite/tools/images/chr-source/.
            fi
          fi

      - name: Building cromite container ${{ env.VERSION }}-${{ env.CROMITE_SHA }}
        shell: bash
        run: |
          docker pull uazo/cromite:$VERSION-$CROMITE_SHA || true
          IS_PRESENT=$(docker inspect --type=image uazo/cromite:$VERSION-$CROMITE_SHA > /dev/null ; echo $?)
          if [ $IS_PRESENT -ne "0" ]; then
            IS_PRESENT=$(./regctl image inspect uazo/cromite:$VERSION-$CROMITE_SHA > /dev/null ; echo $?)
            if [ $IS_PRESENT -ne "0" ]; then
              DOCKER_BUILDKIT=1 docker build -t uazo/cromite:$VERSION-$CROMITE_SHA --progress plain \
                --build-arg CROMITE_SHA=$CROMITE_SHA \
                --build-arg VERSION=$VERSION \
                --build-arg HTTP_PROXY="$PROXY_ADDR" \
                cromite/tools/images/cromite-source/.
            fi
          fi

      - name: Building cromite-build container ${{ env.VERSION }}-${{ env.CROMITE_SHA }}
        shell: bash
        run: |
          docker pull uazo/cromite-build:$VERSION-$CROMITE_SHA || true
          IS_PRESENT=$(docker inspect --type=image uazo/cromite-build:$VERSION-$CROMITE_SHA > /dev/null ; echo $?)
          if [ $IS_PRESENT -ne "0" ]; then
            IS_PRESENT=$(./regctl image inspect uazo/cromite-build:$VERSION-$CROMITE_SHA > /dev/null ; echo $?)
            if [ $IS_PRESENT -ne "0" ]; then
              DOCKER_BUILDKIT=1 docker build -t uazo/cromite-build:$VERSION-$CROMITE_SHA --progress plain \
                --build-arg CROMITE_SHA=$CROMITE_SHA \
                --build-arg VERSION=$VERSION \
                --build-arg HTTP_PROXY="$PROXY_ADDR" \
                --no-cache \
                cromite/tools/images/cromite-build/.
            fi
          fi

      - name: Get uazo/cromite-build from docker hub if present
        shell: bash
        run: |
          IS_PRESENT=$(./regctl image inspect uazo/cromite-build:$VERSION-$CROMITE_SHA > /dev/null ; echo $?)
          if [ $IS_PRESENT -eq "0" ]; then
            docker pull uazo/cromite-build:$VERSION-$CROMITE_SHA
          fi

      - name: Mark image to build
        shell: bash
        run: |
          IS_PRESENT=$(docker inspect --type=image uazo/cromite-build:build > /dev/null ; echo $?)
          if [ $IS_PRESENT -eq "0" ]; then
            docker rmi uazo/cromite-build:build || true
          fi
          docker tag uazo/cromite-build:$VERSION-$CROMITE_SHA uazo/cromite-build:build || true

  prepare_out:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.fetch_out.outputs.found }}
    steps:
      - name: Prepare workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: fetch_out
        name: Try download prebuilt out/arm64 from uazo/cromite release or extract from image
        shell: bash
        run: |
          set -euo pipefail
          # Resolve requested refs
          INPUT_SHA='${{ github.event.inputs.sha }}'
          INPUT_RELEASE='${{ github.event.inputs.cromite_release }}'
          TAG="$INPUT_RELEASE"
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            echo "Resolving latest release tag via GitHub API"
            TAG=$(curl -s https://api.github.com/repos/uazo/cromite/releases/latest | grep '"tag_name":' | sed -E 's/.*"tag_name":\s*"([^\"]+)".*/\1/' || true)
            echo "Resolved cromite release tag: $TAG"
          fi

          # Determine a ref to checkout: prefer explicit SHA input, otherwise use TAG
          REF="$INPUT_SHA"
          if [ -z "$REF" ]; then
            REF="$TAG"
          fi

          # Clone the cromite repo at the chosen ref so we can read build/RELEASE and the commit SHA
          rm -rf cromite || true
          if git clone --depth 1 --branch "$REF" https://github.com/uazo/cromite.git cromite 2>/dev/null; then
            echo "Cloned uazo/cromite@$REF"
          else
            echo "Shallow clone by branch failed, falling back to full clone and checkout"
            git clone https://github.com/uazo/cromite.git cromite
            cd cromite
            git fetch --all --tags --prune
            git checkout "$REF" || true
            cd ..
          fi

          mkdir -p tmp_out
          ASSETS=("out-arm64.tar.gz" "out_arm64.tar.gz" "out/arm64.tar.gz" "out_arm64.tar" "out-arm64.tar")
          FOUND=0

          # If the caller supplied a direct URL to an out tar, try it first
          INPUT_OUT_URL='${{ github.event.inputs.out_url }}'
          if [ -n "$INPUT_OUT_URL" ]; then
            echo "Trying direct out URL: $INPUT_OUT_URL"
            if curl -sfL "$INPUT_OUT_URL" -o /tmp/out_direct.tar.gz; then
              mkdir -p tmp_out/arm64
              tar -xzf /tmp/out_direct.tar.gz -C tmp_out 2>/dev/null || tar -xf /tmp/out_direct.tar.gz -C tmp_out 2>/dev/null || true
              FOUND=1
            else
              echo "Direct out URL not reachable"
            fi
          fi

          # Try release assets from upstream uazo/cromite
          if [ $FOUND -eq 0 ]; then
            for a in "${ASSETS[@]}"; do
              URL="https://github.com/uazo/cromite/releases/download/${TAG}/${a}"
              echo "Trying $URL"
              if curl -sfL "$URL" -o /tmp/$a; then
                echo "Downloaded asset $a"
                mkdir -p tmp_out/arm64
                tar -xzf /tmp/$a -C tmp_out 2>/dev/null || tar -xf /tmp/$a -C tmp_out 2>/dev/null || true
                FOUND=1
                break
              fi
            done
          fi

          # If still not found, try this repository's releases (helpful for forks/uploads)
          if [ $FOUND -eq 0 ]; then
            echo "Checking this repository (${GITHUB_REPOSITORY}) releases for prebuilt assets"
            for a in "${ASSETS[@]}"; do
              URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${a}"
              echo "Trying $URL"
              if curl -sfL "$URL" -o /tmp/$a; then
                echo "Downloaded asset $a from ${GITHUB_REPOSITORY}"
                mkdir -p tmp_out/arm64
                tar -xzf /tmp/$a -C tmp_out 2>/dev/null || tar -xf /tmp/$a -C tmp_out 2>/dev/null || true
                FOUND=1
                break
              fi
            done
          fi

          # If no tarball, try docker images using the same tag pattern as build_cromite
          if [ $FOUND -eq 0 ]; then
            echo "No release asset found, trying docker image extraction"
            VERSION=""
            if [ -f cromite/build/RELEASE ]; then
              VERSION=$(cat cromite/build/RELEASE)
            fi
            CROMITE_SHA=""
            if [ -d cromite ]; then
              CROMITE_SHA=$(cd cromite && git rev-parse HEAD || true)
            fi

            IMAGE_TAGS=()
            if [ -n "$VERSION" ] && [ -n "$CROMITE_SHA" ]; then
              IMAGE_TAGS+=("uazo/cromite-build:${VERSION}-${CROMITE_SHA}")
            fi
            IMAGE_TAGS+=("uazo/cromite-build:build" "uazo/cromite-build:latest")

            pulled=0
            if command -v docker >/dev/null 2>&1; then
              for IMAGE in "${IMAGE_TAGS[@]}"; do
                echo "Attempting docker pull $IMAGE"
                attempts=0
                max_attempts=3
                until [ $attempts -ge $max_attempts ]; do
                  if docker pull "$IMAGE"; then
                    pulled=1
                    break
                  fi
                  attempts=$((attempts+1))
                  echo "docker pull failed attempt $attempts for $IMAGE, retrying in $((attempts*5))s"
                  sleep $((attempts*5))
                done
                if [ $pulled -eq 1 ]; then
                  echo "Pulled $IMAGE"
                  CID=$(docker create "$IMAGE" true 2>/dev/null || true)
                  if [ -n "$CID" ]; then
                    if docker cp "$CID":/home/lg/working_dir/chromium/src/out/arm64 tmp_out/arm64 2>/dev/null || docker cp "$CID":/out/arm64 tmp_out/arm64 2>/dev/null; then
                      echo "Copied out/arm64 from container $CID"
                      FOUND=1
                      docker rm "$CID" || true
                      break
                    else
                      echo "docker cp failed to copy out/arm64 from $CID"
                      docker rm "$CID" || true
                    fi
                  else
                    echo "docker create failed for $IMAGE, ContainerId empty"
                  fi
                fi
              done

              # If standard tags didn't work, probe Docker Hub for the most recent tags and try them
              if [ $pulled -eq 0 ] && command -v docker >/dev/null 2>&1; then
                echo "No standard tag pulled; querying Docker Hub for recent tags"
                # request up to 100 tags, extract names
                TAG_JSON=$(curl -sfL "https://registry.hub.docker.com/v2/repositories/uazo/cromite-build/tags?page_size=100" || true)
                if [ -n "$TAG_JSON" ]; then
                  # extract tag names (fallback if jq not present)
                  TAGS=$(echo "$TAG_JSON" | grep -oP '"name":\s*"\K[^"]+' | tr '\n' ' ')
                  for t in $TAGS; do
                    # skip empty
                    if [ -z "$t" ]; then continue; fi
                    # avoid re-trying tags already in IMAGE_TAGS
                    SKIP=0
                    for et in "${IMAGE_TAGS[@]}"; do
                      if [ "$et" = "uazo/cromite-build:$t" ]; then SKIP=1; break; fi
                    done
                    if [ $SKIP -eq 1 ]; then continue; fi

                    IMAGE="uazo/cromite-build:$t"
                    echo "Attempting docker pull $IMAGE (from Docker Hub tag list)"
                    attempts=0
                    max_attempts=2
                    until [ $attempts -ge $max_attempts ]; do
                      if docker pull "$IMAGE"; then
                        pulled=1
                        break
                      fi
                      attempts=$((attempts+1))
                      sleep $((attempts*5))
                    done
                    if [ $pulled -eq 1 ]; then
                      echo "Pulled $IMAGE"
                      CID=$(docker create "$IMAGE" true 2>/dev/null || true)
                      if [ -n "$CID" ]; then
                        if docker cp "$CID":/home/lg/working_dir/chromium/src/out/arm64 tmp_out/arm64 2>/dev/null || docker cp "$CID":/out/arm64 tmp_out/arm64 2>/dev/null; then
                          echo "Copied out/arm64 from container $CID"
                          FOUND=1
                          docker rm "$CID" || true
                          break
                        else
                          echo "docker cp failed for $IMAGE"
                          docker rm "$CID" || true
                        fi
                      fi
                    fi
                  done
                else
                  echo "Docker Hub tags query returned empty response"
                fi
              fi
            else
              echo "docker CLI not available on runner; skipping docker image extraction"
            fi
          fi


          if [ $FOUND -eq 1 ]; then
            tar -czf out-arm64.tar.gz -C tmp_out arm64 || tar -czf out-arm64.tar.gz tmp_out/arm64 || true
            ls -la out-arm64.tar.gz
            echo "found=1" >> $GITHUB_OUTPUT
          else
            echo "No prebuilt out/arm64 found"

            # Try to trigger the repository workflow that builds cromite artifacts
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              BRANCH="${GITHUB_REF#refs/heads/}"
              if [ -z "$BRANCH" ]; then BRANCH="main"; fi
              echo "Dispatching build_cromite workflow on branch $BRANCH (sha: $CROMITE_SHA)"
              curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build_cromite.yaml/dispatches" \
                -d "{\"ref\": \"$BRANCH\", \"inputs\": { \"sha\": \"$CROMITE_SHA\", \"type\": \"ci\", \"debug\": \"false\", \"clangd\": \"false\" } }" || true

              # Poll for up to 30 attempts (approx 30 minutes) for artifacts/images to appear
              attempts=0
              max_attempts=30
              until [ $attempts -ge $max_attempts ]; do
                attempts=$((attempts+1))
                echo "Checking for prebuilt out (attempt $attempts/$max_attempts)"

                # try release assets again
                for a in "${ASSETS[@]}"; do
                  URL="https://github.com/uazo/cromite/releases/download/${TAG}/${a}"
                  if curl -sfL "$URL" -o /tmp/$a; then
                    echo "Downloaded asset $a after dispatch"
                    mkdir -p tmp_out/arm64
                    tar -xzf /tmp/$a -C tmp_out 2>/dev/null || tar -xf /tmp/$a -C tmp_out 2>/dev/null || true
                    FOUND=1
                    break
                  fi
                done
                if [ $FOUND -eq 1 ]; then break; fi

                # try docker images again
                if command -v docker >/dev/null 2>&1; then
                  for IMAGE in "${IMAGE_TAGS[@]}"; do
                    echo "Attempting docker pull $IMAGE"
                    if docker pull "$IMAGE"; then
                      CID=$(docker create "$IMAGE" true 2>/dev/null || true)
                      if [ -n "$CID" ]; then
                        if docker cp "$CID":/home/lg/working_dir/chromium/src/out/arm64 tmp_out/arm64 2>/dev/null || docker cp "$CID":/out/arm64 tmp_out/arm64 2>/dev/null; then
                          echo "Copied out/arm64 from container $CID after dispatch"
                          FOUND=1
                          docker rm "$CID" || true
                          break
                        else
                          docker rm "$CID" || true
                        fi
                      fi
                    fi
                  done
                fi

                if [ $FOUND -eq 1 ]; then break; fi
                echo "Not found yet, sleeping 60s"
                sleep 60
              done
            else
              echo "No GITHUB_TOKEN available; cannot dispatch build_cromite workflow"
            fi

            if [ $FOUND -eq 1 ]; then
              tar -czf out-arm64.tar.gz -C tmp_out arm64 || tar -czf out-arm64.tar.gz tmp_out/arm64 || true
              ls -la out-arm64.tar.gz
              echo "found=1" >> $GITHUB_OUTPUT
            else
              echo "found=0" >> $GITHUB_OUTPUT
              echo "No prebuilt out/arm64 found after dispatch/polling"
            fi
          fi

      - name: Upload out/arm64 artifact
        if: steps.fetch_out.outputs.found == '1'
        uses: actions/upload-artifact@v4
        with:
          name: out-arm64
          path: out-arm64.tar.gz

  build:
    runs-on: ubuntu-latest
    needs: prepare_out
    if: success()
    timeout-minutes: 1440
    env:
      WORKSPACE: ${{ github.workspace }}
      HOME: ${{ github.workspace }}
      TARGET_ISDEBUG: ${{ github.event.inputs.debug || 'false' }}
      TARGET_OS: android
      USE_KEYSTORE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sign || 'false' }}
      CROMITE_PREF_HASH_SEED_BIN: ${{ secrets.CROMITE_PREF_HASH_SEED_BIN }}

    steps:
      - name: Prepare Build Container
        shell: bash
        run: |
          PATH=$WORKSPACE/chromium/src/third_party/llvm-build/Release+Asserts/bin:$WORKSPACE/depot_tools/:/usr/local/go/bin:$WORKSPACE/mtool/bin:$PATH
          cd $WORKSPACE

          # reset proxy env
          HTTP_PROXY=
          HTTPS_PROXY=
          http_proxy=
          https_proxy=

          sudo chown lg /home/lg/working_dir || true

          # prepare keystore only if requested
          if [ "${USE_KEYSTORE:-}" = "true" ]; then
            echo "${{ secrets.KEYSTORE }}" > cromite.keystore.asc || true
            if [ -s cromite.keystore.asc ]; then
              gpg --homedir ./ -d --passphrase "${{ secrets.KEYSTORE_PASSPHRASE }}" --batch cromite.keystore.asc > cromite.keystore || true
            fi
          fi

      - name: Download prebuilt out-arm64 artifact (if available)
        uses: actions/download-artifact@v4
        with:
          name: out-arm64
          path: ${{ env.WORKSPACE }}/chromium/src/out/arm64
        continue-on-error: true

      - name: Checkout iltix repository (workflow repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run build (use cromite image if available)
        shell: bash
        run: |
          set -euo pipefail
          HOST_WS="${{ github.workspace }}"
          CONTAINER_WS="/home/lg/working_dir"
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cromite_release || 'latest' }}"
          if [ "$TAG" = "latest" ]; then
            API_TAG=$(curl -s https://api.github.com/repos/uazo/cromite/releases/latest | grep '"tag_name":' | sed -E 's/.*"tag_name":\s*"([^"]+)".*/\1/' || true)
            if [ -n "$API_TAG" ]; then
              TAG="$API_TAG"
            fi
          fi
          IMAGE="uazo/cromite-build:$TAG"

          # Try docker pull with retries; if available, run build in container and apply patches there
          pulled=0
          if command -v docker >/dev/null 2>&1; then
            attempts=0
            max_attempts=3
            until [ $attempts -ge $max_attempts ]; do
              if docker pull "$IMAGE"; then
                pulled=1
                break
              fi
              attempts=$((attempts+1))
              echo "docker pull failed attempt $attempts, retrying in $((attempts*5))s"
              sleep $((attempts*5))
            done
          else
            echo "docker CLI not available on runner; will build on host"
          fi

          if [ "$pulled" = "1" ]; then
            echo "Running build inside container $IMAGE"
            docker run --rm \
              -v "$HOST_WS/iltix/patches":"$CONTAINER_WS/iltix_patches":ro \
              -e WORKSPACE="$CONTAINER_WS" \
              -e USE_KEYSTORE="$USE_KEYSTORE" \
              -w "$CONTAINER_WS" \
              "$IMAGE" bash -lc '
                set -euo pipefail
                cd chromium/src
                # Apply iltix patches mounted into /home/lg/working_dir/iltix_patches
                if [ -d /home/lg/working_dir/iltix_patches ]; then
                  for p in /home/lg/working_dir/iltix_patches/*.patch; do
                    [ -e "$p" ] || continue
                    echo "Applying patch: $p"
                    if git am --3way < "$p"; then
                      echo "Applied $p with git am"
                    else
                      if git apply --index "$p"; then
                        git commit -m "Apply iltix patch: $(basename "$p")" || true
                      else
                        echo "git apply failed for $p"
                      fi
                    fi
                  done
                fi
                if [ -d out/arm64 ] && [ "$(ls -A out/arm64 | wc -l)" -gt 0 ]; then
                  echo "Found prebuilt out/arm64 — running incremental APK build"
                  vpython3 depot_tools/siso.py ninja -C out/arm64 chrome_public_apk --offline || true
                else
                  echo "No prebuilt out/arm64 found — running full GN/Ninja build"
                  gn gen --args="target_os = \"android\" $(cat /home/lg/working_dir/cromite/build/cromite.gn_args) target_cpu = \"arm64\" " out/arm64 || true
                  vpython3 depot_tools/siso.py ninja -C out/arm64 chrome_public_bundle --offline
                  vpython3 depot_tools/siso.py ninja -C out/arm64 chrome_public_apk --offline
                  cp ../../cromite/build/RELEASE out/arm64 || true
                fi'
          else
            echo "Building on host"
            cd "$HOST_WS/chromium/src"
            # Apply iltix patches on host
            if [ -d "$HOST_WS/iltix/patches" ]; then
              for p in "$HOST_WS"/iltix/patches/*.patch; do
                [ -e "$p" ] || continue
                echo "Applying patch: $p"
                if git am --3way < "$p"; then
                  echo "Applied $p with git am"
                else
                  if git apply --index "$p"; then
                    git commit -m "Apply iltix patch: $(basename "$p")" || true
                  else
                    echo "git apply failed for $p"
                  fi
                fi
              done
            fi
            if [ -d out/arm64 ] && [ "$(ls -A out/arm64 | wc -l)" -gt 0 ]; then
              vpython3 "$HOST_WS/depot_tools/siso.py" ninja -C out/arm64 chrome_public_apk --offline || true
            else
              gn gen --args="target_os = \"android\" $(cat $HOST_WS/cromite/build/cromite.gn_args) target_cpu = \"arm64\" " out/arm64 || true
              vpython3 "$HOST_WS/depot_tools/siso.py" ninja -C out/arm64 chrome_public_bundle --offline
              vpython3 "$HOST_WS/depot_tools/siso.py" ninja -C out/arm64 chrome_public_apk --offline
              cp ../../cromite/build/RELEASE out/arm64 || true
            fi
          fi

      - name: Get ninja logs Android arm64
        if: ${{ (github.event.inputs.target_os == 'android' || github.event.inputs.target_os == 'all') && (github.event.inputs.build == 'arm64' || github.event.inputs.build == 'all') }}
        shell: bash
        run: |
          cd $WORKSPACE
          $WORKSPACE/ninjatracing/ninjatracing -a $WORKSPACE/chromium/src/out/arm64/.ninja_log >$WORKSPACE/chromium/src/out/arm64/ninja_log_trace.json || true
          python3 $WORKSPACE/chromium/src/third_party/catapult/tracing/bin/trace2html $WORKSPACE/chromium/src/out/arm64/ninja_log_trace.json || true

      - name: Upload release APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iltix-chrome-arm64-apk
          path: $WORKSPACE/chromium/src/out/arm64/apks/ChromePublic.apk
