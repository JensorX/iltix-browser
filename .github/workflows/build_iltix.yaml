name: Build Iltix Browser

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: 'Docker image to use (e.g. uazo/cromite-build:...)'
        required: false
        default: 'auto'
      arch:
        description: 'Android architecture [arm64/arm/x64]'
        required: true
        default: 'arm64'
      debug:
        description: 'Debug build? [true/false]'
        required: true
        default: 'false'

  push:
    branches:
      - iltix
    paths:
      - 'build/patches/Iltix-*.patch'
      - 'build/cromite_patches_list.txt'
      - 'build/cromite.gn_args'
      - 'tools/iltix/**'
      - '.github/workflows/build_iltix.yaml'

env:
  ARCH: ${{ github.event.inputs.arch || 'arm64' }}
  TARGET_ISDEBUG: ${{ github.event.inputs.debug || 'false' }}

  # 🔥 HARD FIX: Proxy komplett killen
  http_proxy: ""
  https_proxy: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""

jobs:
  setup:
    name: Resolve Cromite build image
    runs-on: ubuntu-latest
    outputs:
      cromite_sha: ${{ steps.resolve.outputs.cromite_sha }}
      docker_image: ${{ steps.resolve.outputs.docker_image }}

    steps:
      - name: Disable proxy (critical fix)
        run: |
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY || true
          git config --global --unset http.proxy || true
          git config --global --unset https.proxy || true

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: iltix

      - name: Resolve Cromite image
        id: resolve
        run: |
          if [ "${{ github.event.inputs.docker_image }}" = "auto" ] || [ -z "${{ github.event.inputs.docker_image }}" ]; then
            LATEST_TAG=$(curl -s https://hub.docker.com/v2/repositories/uazo/cromite-build/tags/?page_size=1\&ordering=last_updated \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['results'][0]['name'])")

            DOCKER_IMAGE="uazo/cromite-build:${LATEST_TAG}"
          else
            DOCKER_IMAGE="${{ github.event.inputs.docker_image }}"
          fi

          echo "docker_image=$DOCKER_IMAGE" >> $GITHUB_OUTPUT
          echo "[iltix] Using: $DOCKER_IMAGE"

  build:
    name: Build Iltix Browser
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Disable proxy (safety)
        run: |
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY || true
          git config --global --unset http.proxy || true
          git config --global --unset https.proxy || true

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: iltix

      - name: Pull Docker image
        run: |
          docker pull ${{ needs.setup.outputs.docker_image }}

      - name: Run build inside container
        run: |
          docker run --rm \
            -e ARCH=${ARCH} \
            -e TARGET_ISDEBUG=${TARGET_ISDEBUG} \
            -e http_proxy= \
            -e https_proxy= \
            -e HTTP_PROXY= \
            -e HTTPS_PROXY= \
            -v ${{ github.workspace }}:/src \
            ${{ needs.setup.outputs.docker_image }} \
            bash -c "
              cd /src && \
              ./tools/iltix/build.sh
            "

      # =========================
      # 🔥 HIER KOMMT DEIN FEHLENDER TEIL
      # =========================
      - name: Apply icons
        run: |
          echo "[iltix] Applying icons..."
          bash ./tools/iltix/apply_icons.sh

      - name: Package final artifacts
        run: |
          echo "[iltix] Final packaging step..."
          bash ./tools/iltix/package.sh || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iltix-${{ env.ARCH }}-${{ env.TARGET_ISDEBUG }}
          path: |
            out/**/*.apk
            out/**/*.aab
